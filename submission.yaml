submission:
  title: "MediSafe AI — Drug Interaction & Medication Safety Assistant"
  problem_statement: >
    Medication combinations can create potential safety risks that are difficult
    for learners and non-specialist users to understand.
  solution_summary: >
    MediSafe AI screens selected medicine pairs against a curated educational
    interaction dataset, explains potential concerns, and generates a review report.
  key_features:
    - "Medicine selection and pairwise screening"
    - "Severity and mechanism explanations"
    - "Source-linked findings"
    - "Downloadable safety report"
